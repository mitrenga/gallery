<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Photo and Video Archive</title>
  <desc>Application icon showing photos and a video symbol stored in an archive box.</desc>
  <defs>
