# nginx – the gallery alone in the web root (https://photos.example.com/)
#
#   /var/www/gallery/        this project (index.php, getData.php, auth.php, gallery/, thumbs/ …)
#
# Install:  sudo cp nginx/root.conf /etc/nginx/sites-available/photos.example.com
#           sudo ln -s ../sites-available/photos.example.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Adjust server_name, root, the certificate paths and the php-fpm socket.
# Then run the checklist from the README.

server {
	listen 80;
	listen [::]:80;
	server_name photos.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name photos.example.com;

	root /var/www/gallery;
	index index.php;

	ssl_certificate     /etc/letsencrypt/live/photos.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	add_header Strict-Transport-Security "max-age=63072000" always;

	# ---- never serve: passwords, git, scripts, docs, dot files ----
	location ~ /config\.json$ { deny all; }
	location ~ /\.(?:git|ht) { deny all; }
	location ~* \.(?:sh|sql|log|sample|md)$ { return 404; }

	# ---- photos and thumbnails only for signed-in users (auth_request -> auth.php) ----
	location ~ ^/(?:gallery|thumbs)/ {
		auth_request /auth-check;
	}
	location = /auth-check {
		internal;
		include fastcgi_params;
		fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $document_root/auth.php;
		fastcgi_pass_request_body off;
		fastcgi_param CONTENT_LENGTH "";
	}

	# ---- the application (SPA – everything unknown goes to index.php) ----
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_read_timeout 300;
	}

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
